apiVersion: v1
kind: Pod
metadata:
  name: poker
  labels:
    app: poker
spec:
  # Fast teardown on `kubectl delete` / `just stop-poker` (default grace is 30s).
  terminationGracePeriodSeconds: 0
  containers:
    - name: poker
      image: quay.io/rajjoshi/poker:latest
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "2"
          memory: 4Gi
  restartPolicy: Always
