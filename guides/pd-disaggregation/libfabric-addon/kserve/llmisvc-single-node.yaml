# Single-node LLMInferenceService with RHAIIS + libfabric-addon on EKS/EFA.
#
# Self-contained: all EFA/libfabric config is inline (no baseRef needed).
# Model is loaded from local NVMe HF cache via init container symlinks.
#
# The link-model init container creates absolute symlinks from /mnt/models
# into the HF cache snapshot directory on the mounted NVMe volume. This lets
# vLLM find and load the model without downloading.
#
# Prerequisites:
#   - Model has been downloaded to NVMe HF cache on GPU nodes
#   - imagePullSecrets exist in the namespace (rhai-pull-secret, quay-pull-secret)
#
# Apply:
#   kubectl apply -f llmisvc-single-node.yaml -n <namespace>

apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: llama-70b-single-node
spec:
  replicas: 1

  model:
    name: RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
    uri: hf://RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic

  parallelism:
    tensor: 4

  storageInitializer:
    enabled: false

  router:
    scheduler:
      template:
        containers:
          - name: main
        imagePullSecrets:
          - name: rhai-pull-secret
    route: {}
    gateway: {}

  template:
    imagePullSecrets:
      - name: rhai-pull-secret
      - name: quay-pull-secret

    initContainers:
      - name: link-model
        image: busybox
        env:
          - name: MODEL_NAME
            value: RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
        command:
          - sh
          - -c
          - |
            set -e
            HF_DIR="/model-store/hub/models--$(echo "$MODEL_NAME" | sed 's|/|--|g')"
            SNAP=$(ls -d "$HF_DIR"/snapshots/*/ 2>/dev/null | head -1)
            if [ -z "$SNAP" ]; then echo "ERROR: no snapshot for $MODEL_NAME in $HF_DIR"; exit 1; fi
            echo "Linking $MODEL_NAME from $SNAP"
            ls -1A "$SNAP" | while read -r f; do ln -sf "${SNAP}${f}" "/mnt/models/${f}"; done
            echo "Created $(ls -1A /mnt/models | wc -l) symlinks in /mnt/models"
        volumeMounts:
          - name: model-store
            mountPath: /model-store
            readOnly: true
          - name: model-dir
            mountPath: /mnt/models

      - name: inject-libfabric
        image: quay.io/rajjoshi/libfabric-addon:3.5.0-1784900545
        imagePullPolicy: Always
        command: ["/bin/bash", "/artifacts/inject.sh", "/target/plugins", "/target/efa-libs"]
        volumeMounts:
          - name: nixl-plugins
            mountPath: /target/plugins
          - name: efa-libs
            mountPath: /target/efa-libs

    containers:
      - name: main
        env:
          - name: FI_PROVIDER
            value: efa
          - name: FI_EFA_USE_DEVICE_RDMA
            value: "1"
          - name: NIXL_PLUGIN_DIR
            value: /opt/nixl-plugins
          - name: LD_LIBRARY_PATH
            value: "/opt/efa-libs:/usr/local/cuda/lib64:/opt/app-root/lib/python3.12/site-packages/.nixl_cu13.mesonpy.libs"
          - name: VLLM_ADDITIONAL_ARGS
            value: >-
              --block-size 128
              --max-model-len 32768
              --gpu-memory-utilization 0.92
              --disable-uvicorn-access-log
        securityContext:
          capabilities:
            add:
              - IPC_LOCK
        resources:
          requests:
            nvidia.com/gpu: "4"
            vpc.amazonaws.com/efa: "16"
            cpu: "48"
            memory: 256Gi
          limits:
            nvidia.com/gpu: "4"
            vpc.amazonaws.com/efa: "16"
            cpu: "48"
            memory: 256Gi
        volumeMounts:
          - name: model-dir
            mountPath: /mnt/models
            readOnly: true
          - name: model-store
            mountPath: /model-store
            readOnly: true
          - name: nixl-plugins
            mountPath: /opt/nixl-plugins
          - name: efa-libs
            mountPath: /opt/efa-libs
          - name: shm
            mountPath: /dev/shm
        startupProbe:
          httpGet:
            path: /v1/models
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /v1/models
            port: 8000
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3

    volumes:
      - name: model-store
        hostPath:
          path: /mnt/nvme/models
          type: Directory
      - name: model-dir
        emptyDir: {}
      - name: nixl-plugins
        emptyDir: {}
      - name: efa-libs
        emptyDir: {}
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: "16Gi"
