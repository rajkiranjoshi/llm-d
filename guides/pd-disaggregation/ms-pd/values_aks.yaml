# AKS-specific ms-pd values (helmfile `-e aks` uses this file instead of values.yaml — not layered on it).
# NVMe hostPath, rdma/shared_ib, TP=8, Llama-3.2-3B-Instruct-FP8, HF_HOME + minimal LIBRARY_PATH for Triton JIT (libcuda).
#
# UCX NIC selection: decode/prefill set `VLLM_GPU_NIC_PCIE_MAPPING` (GPU BDF=NIC BDF pairs)
# together with `VLLM_NIC_SELECTION_VARS` (env vars to populate from the mapping, e.g.
# UCX_NET_DEVICES:1,NVSHMEM_HCA_LIST:1,NCCL_IB_HCA:1).
# The runtime image (e.g. ghcr.io/rajkiranjoshi/llm-d-cuda:sha-c8a6e27-nic-selection) ships
# vllm_net_devices.py + executor hooks in-tree; no ConfigMap overlay here.
# To override vLLM from a chart instead, set `aksUcxHotfixChart` to true in helmfile.yaml.gotmpl and restore
# the `vllm-ucx-multiproc-hotfix` volumeMounts + volume (see charts/vllm-ucx-multiproc-hotfix/README.md).
#
# P/D disaggregation here uses TP-only per pod (parallelism.tensor); NIXL/UCX works with that layout.
# Logs may show `EngineCore_DP0` even when data_parallel_size is 1 (vLLM naming). Multi-DP on one node
# with PCIe mapping is unsupported unless local_rank offset matches gpu_worker DP adjustment.
multinode: false

# Verified in running prefill/decode pods: gcc -lcuda works with this path only (no /usr/local/nvidia, EFA, or UCX in image).
x-libcuda-library-path: &libcuda_library_path "/usr/lib/x86_64-linux-gnu"
# GPU BDF (nvidia-smi pci.bus_id) → NIC BDF (sysfs /sys/class/infiniband/mlx5_*/device); see chart README.
x-vllm-gpu-nic-pcie-mapping: &vllm_gpu_nic_pcie_mapping "00000001:00:00.0=0101:00:00.0,00000002:00:00.0=0102:00:00.0,00000003:00:00.0=0103:00:00.0,00000008:00:00.0=0104:00:00.0,00000009:00:00.0=0105:00:00.0,0000000A:00:00.0=0106:00:00.0,0000000B:00:00.0=0107:00:00.0,0000000C:00:00.0=0108:00:00.0"

modelArtifacts:
  # Previously: hf://RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
  # Previously: hf://Qwen/Qwen2.5-3B-Instruct
  uri: "hf://RedHatAI/Llama-3.2-3B-Instruct-FP8"
  # Previously: 140Gi
  size: 15Gi
  authSecretName: "hf-secret"
  # Previously: RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
  # Previously: Qwen/Qwen2.5-3B-Instruct
  name: "RedHatAI/Llama-3.2-3B-Instruct-FP8"
  labels:
    llm-d.ai/inference-serving: "true"
    llm-d.ai/guide: "pd-disaggregation"
    llm-d.ai/hardware-variant: "gpu"
    llm-d.ai/accelerator-vendor: "nvidia"
    # Previously: Llama-3.3-70B-Instruct-FP8-dynamic
    # Previously: Qwen2.5-3B-Instruct
    llm-d.ai/model: "Llama-3.2-3B-Instruct-FP8"

routing:
  servicePort: 8000
  proxy:
    image: ghcr.io/llm-d/llm-d-routing-sidecar:v0.7.1
    connector: nixlv2
    secure: false

decode:
  create: true
  # On small GPU pools, many 1-GPU prefill replicas can spread across nodes and leave no single node
  # with 8 free GPUs for TP=8 decode. Required podAntiAffinity vs prefill (and the mirror on prefill)
  # keeps P and D on disjoint hosts; prefill podAffinity below encourages prefills to pack.
  extraConfig:
    imagePullSecrets:
      - name: redhat-pull-secret
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: llm-d.ai/role
                  operator: In
                  values:
                    - prefill
            topologyKey: kubernetes.io/hostname
  parallelism:
    tensor: 8
  replicas: 1
  monitoring:
    podmonitor:
      enabled: true
      portName: "vllm"
      path: "/metrics"
      interval: "30s"
  containers:
    - name: "vllm"
      image: registry.redhat.io/rhaii/vllm-cuda-rhel9:3.4.0-1777444689
      imagePullPolicy: Always
      modelCommand: vllmServe
      args:
        - "--block-size"
        - "128"
        - "--kv-transfer-config"
        - '{"kv_connector":"NixlConnector", "kv_role":"kv_both"}'
        - "--disable-uvicorn-access-log"
        - "--max-model-len"
        - "32768"
      env:
        - name: VLLM_NIXL_SIDE_CHANNEL_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: HF_HOME
          value: /model-cache
        - name: LIBRARY_PATH
          value: *libcuda_library_path
        - name: VLLM_GPU_NIC_PCIE_MAPPING
          value: *vllm_gpu_nic_pcie_mapping
        - name: VLLM_NIC_SELECTION_VARS
          value: "UCX_NET_DEVICES:1,NVSHMEM_HCA_LIST:1,NCCL_IB_HCA:1"
        - name: NVSHMEM_ENABLE_NIC_PE_MAPPING
          value: "1"
      ports:
        - containerPort: 8200
          name: vllm
          protocol: TCP
        - containerPort: 5600
          name: nixl
          protocol: TCP
      resources:
        limits:
          memory: 64Gi
          cpu: "10"
          rdma/shared_ib: 1
        requests:
          memory: 64Gi
          cpu: "10"
          rdma/shared_ib: 1
      # Host NVMe at /model-cache; avoid chart emptyDir at the same path (mountModelVolume).
      mountModelVolume: false
      volumeMounts:
        - name: model-cache
          mountPath: /model-cache
        - name: metrics-volume
          mountPath: /.config
        - name: shm
          mountPath: /dev/shm
        - name: torch-compile-cache
          mountPath: /.cache
        # ConfigMap overlay (requires helmfile vllm-ucx-hotfix-* release):
        # RHAII image: site-packages path (no /opt/vllm-source editable install)
        - name: vllm-ucx-multiproc-hotfix
          mountPath: /opt/app-root/lib64/python3.12/site-packages/vllm/envs.py
          subPath: envs.py
        - name: vllm-ucx-multiproc-hotfix
          mountPath: /opt/app-root/lib64/python3.12/site-packages/vllm/platforms/cuda.py
          subPath: cuda.py
        - name: vllm-ucx-multiproc-hotfix
          mountPath: /opt/app-root/lib64/python3.12/site-packages/vllm/platforms/interface.py
          subPath: interface.py
        - name: vllm-ucx-multiproc-hotfix
          mountPath: /opt/app-root/lib64/python3.12/site-packages/vllm/v1/executor/multiproc_executor.py
          subPath: multiproc_executor.py
        - name: vllm-ucx-multiproc-hotfix
          mountPath: /opt/app-root/lib64/python3.12/site-packages/vllm/v1/executor/uniproc_executor.py
          subPath: uniproc_executor.py
        - name: vllm-ucx-multiproc-hotfix
          mountPath: /opt/app-root/lib64/python3.12/site-packages/vllm/v1/executor/vllm_net_devices.py
          subPath: vllm_net_devices.py
      startupProbe:
        httpGet:
          path: /v1/models
          port: vllm
        initialDelaySeconds: 15
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 60
      livenessProbe:
        httpGet:
          path: /health
          port: vllm
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /v1/models
          port: vllm
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 3
      extraConfig: # mlock for RDMA/NIXL; see guides/pd-disaggregation/README.md
        securityContext:
          capabilities:
            add:
              - "IPC_LOCK"
  volumes:
    - name: model-cache
      hostPath:
        path: /mnt/local-nvme-storage/models
        type: DirectoryOrCreate
    - name: metrics-volume
      emptyDir: {}
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: "16Gi"
    - name: torch-compile-cache
      emptyDir: {}
    - name: vllm-ucx-multiproc-hotfix
      configMap:
        name: vllm-ucx-multiproc-hotfix
        defaultMode: 0444

prefill:
  create: true
  extraConfig:
    imagePullSecrets:
      - name: redhat-pull-secret
    affinity:
      podAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: llm-d.ai/role
                    operator: In
                    values:
                      - prefill
              topologyKey: kubernetes.io/hostname
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: llm-d.ai/role
                  operator: In
                  values:
                    - decode
            topologyKey: kubernetes.io/hostname
