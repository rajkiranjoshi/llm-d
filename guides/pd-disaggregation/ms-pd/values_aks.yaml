# AKS-specific ms-pd values (helmfile `-e aks` uses this file instead of values.yaml — not layered on it).
# NVMe hostPath, rdma/shared_ib, TP=8, Llama FP8 model, HF_HOME + minimal LIBRARY_PATH for Triton JIT (libcuda).
multinode: false

# Verified in running prefill/decode pods: gcc -lcuda works with this path only (no /usr/local/nvidia, EFA, or UCX in image).
x-libcuda-library-path: &libcuda_library_path "/usr/lib/x86_64-linux-gnu"

modelArtifacts:
  uri: "hf://RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic"
  size: 140Gi
  authSecretName: "hf-secret"
  name: "RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic"
  labels:
    llm-d.ai/inference-serving: "true"
    llm-d.ai/guide: "pd-disaggregation"
    llm-d.ai/hardware-variant: "gpu"
    llm-d.ai/accelerator-vendor: "nvidia"
    llm-d.ai/model: "Llama-3.3-70B-Instruct-FP8-dynamic"

routing:
  servicePort: 8000
  proxy:
    image: ghcr.io/llm-d/llm-d-routing-sidecar:v0.7.1
    connector: nixlv2
    secure: false

decode:
  create: true
  parallelism:
    tensor: 8
  replicas: 1
  monitoring:
    podmonitor:
      enabled: true
      portName: "vllm"
      path: "/metrics"
      interval: "30s"
  containers:
    - name: "vllm"
      image: ghcr.io/llm-d/llm-d-cuda:v0.6.0
      modelCommand: vllmServe
      args:
        - "--block-size"
        - "128"
        - "--kv-transfer-config"
        - '{"kv_connector":"NixlConnector", "kv_role":"kv_both"}'
        - "--disable-uvicorn-access-log"
        - "--max-model-len"
        - "32000"
      env:
        - name: VLLM_NIXL_SIDE_CHANNEL_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: HF_HOME
          value: /model-cache
        - name: LIBRARY_PATH
          value: *libcuda_library_path
      ports:
        - containerPort: 8200
          name: vllm
          protocol: TCP
        - containerPort: 5600
          name: nixl
          protocol: TCP
      resources:
        limits:
          memory: 64Gi
          cpu: "16"
          rdma/shared_ib: 1
        requests:
          memory: 64Gi
          cpu: "16"
          rdma/shared_ib: 1
      # Host NVMe at /model-cache; avoid chart emptyDir at the same path (mountModelVolume).
      mountModelVolume: false
      volumeMounts:
        - name: model-cache
          mountPath: /model-cache
        - name: metrics-volume
          mountPath: /.config
        - name: shm
          mountPath: /dev/shm
        - name: torch-compile-cache
          mountPath: /.cache
      startupProbe:
        httpGet:
          path: /v1/models
          port: vllm
        initialDelaySeconds: 15
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 60
      livenessProbe:
        httpGet:
          path: /health
          port: vllm
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /v1/models
          port: vllm
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 3
      extraConfig: # mlock for RDMA/NIXL; see guides/pd-disaggregation/README.md
        securityContext:
          capabilities:
            add:
              - "IPC_LOCK"
  volumes:
    - name: model-cache
      hostPath:
        path: /mnt/local-nvme-storage/models
        type: DirectoryOrCreate
    - name: metrics-volume
      emptyDir: {}
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: "16Gi"
    - name: torch-compile-cache
      emptyDir: {}

prefill:
  create: true
  parallelism:
    tensor: 8
  replicas: 1
  monitoring:
    podmonitor:
      enabled: true
      portName: "vllm"
      path: "/metrics"
      interval: "30s"
  containers:
    - name: "vllm"
      image: ghcr.io/llm-d/llm-d-cuda:v0.6.0
      modelCommand: vllmServe
      args:
        - "--block-size"
        - "128"
        - "--kv-transfer-config"
        - '{"kv_connector":"NixlConnector", "kv_role":"kv_both"}'
        - "--disable-uvicorn-access-log"
        - "--max-model-len"
        - "32000"
      env:
        - name: VLLM_NIXL_SIDE_CHANNEL_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: HF_HOME
          value: /model-cache
        - name: LIBRARY_PATH
          value: *libcuda_library_path
      ports:
        - containerPort: 8000
          name: vllm
          protocol: TCP
        - containerPort: 5600
          name: nixl
          protocol: TCP
      resources:
        limits:
          memory: 64Gi
          cpu: "8"
          rdma/shared_ib: 1
        requests:
          memory: 64Gi
          cpu: "8"
          rdma/shared_ib: 1
      # Host NVMe at /model-cache; avoid chart emptyDir at the same path (mountModelVolume).
      mountModelVolume: false
      volumeMounts:
        - name: model-cache
          mountPath: /model-cache
        - name: metrics-volume
          mountPath: /.config
        - name: shm
          mountPath: /dev/shm
        - name: torch-compile-cache
          mountPath: /.cache
      startupProbe:
        httpGet:
          path: /v1/models
          port: vllm
        initialDelaySeconds: 15
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 60
      livenessProbe:
        httpGet:
          path: /health
          port: vllm
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /v1/models
          port: vllm
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 3
      extraConfig: # mlock for RDMA/NIXL; see guides/pd-disaggregation/README.md
        securityContext:
          capabilities:
            add:
              - "IPC_LOCK"
  volumes:
    - name: model-cache
      hostPath:
        path: /mnt/local-nvme-storage/models
        type: DirectoryOrCreate
    - name: metrics-volume
      emptyDir: {}
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: "16Gi"
    - name: torch-compile-cache
      emptyDir: {}
