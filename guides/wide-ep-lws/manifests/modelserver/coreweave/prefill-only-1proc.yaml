# Wide EP prefill-focused LWS for CoreWeave H200 (2 nodes, 16 GPUs).
# Model: Qwen/Qwen3-235B-A22B-Instruct-2507-FP8 (EP=16, DP=16, TP=1).
# DeepEP high-throughput all2all backend (no cudaGraph).
#
# Single-process launch: one vllm serve manages all 8 local DP ranks via
# --data-parallel-size-local 8 and --data-parallel-hybrid-lb.
#
# WARNING: This currently causes DeepEP dispatch timeout during warmup because
# workers compile at staggered times but the cross-node all2all is a global
# collective requiring all 16 EP ranks to enter simultaneously.
# Use prefill-only-8proc.yaml instead for a working deployment.
---
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: wide-ep-llm-d-prefill
  labels:
    llm-d.ai/inference-serving: "true"
    llm-d.ai/guide: "wide-ep-lws"
    llm-d.ai/accelerator-variant: "gpu"
    llm-d.ai/accelerator-vendor: "nvidia"
    llm-d.ai/model: Qwen3-235B-A22B-Instruct-2507-FP8
    llm-d.ai/role: prefill
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 2
    workerTemplate:
      metadata:
        labels:
          llm-d.ai/inference-serving: "true"
          llm-d.ai/guide: "wide-ep-lws"
          llm-d.ai/accelerator-variant: "gpu"
          llm-d.ai/accelerator-vendor: "nvidia"
          llm-d.ai/model: Qwen3-235B-A22B-Instruct-2507-FP8
          llm-d.ai/role: prefill
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "8000"
          prometheus.io/path: "/metrics"
      spec:
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 16Gi
          - name: hf-cache
            hostPath:
              path: /mnt/local/hf_cache
              type: Directory
          - name: jit-cache
            emptyDir: {}
        containers:
          - name: vllm
            image: vllm/vllm-openai:cu129-nightly-4f940896a32c9e2a0eba7f50d521bf5f6b4de458
            imagePullPolicy: Always
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              capabilities:
                add:
                  - IPC_LOCK
                  - SYS_RAWIO
            command:
              - /bin/bash
              - -c
            args:
              - |-
                find /dev/shm -type f -delete

                START_RANK=$(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))

                exec vllm serve \
                  Qwen/Qwen3-235B-A22B-Instruct-2507-FP8 \
                  --port 8000 \
                  --trust-remote-code \
                  --disable-uvicorn-access-log \
                  --data-parallel-hybrid-lb \
                  --enable-expert-parallel \
                  --tensor-parallel-size $TP_SIZE \
                  --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \
                  --data-parallel-size-local $DP_SIZE_LOCAL \
                  --data-parallel-address ${LWS_LEADER_ADDRESS} \
                  --data-parallel-rpc-port 5555 \
                  --data-parallel-start-rank $START_RANK \
                  --async-scheduling \
                  --enable-dbo \
                  --dbo-prefill-token-threshold 32 \
                  --all2all-backend deepep_high_throughput \
                  --gpu-memory-utilization 0.75
            env:
              - name: DP_SIZE_LOCAL
                value: "8"
              - name: TP_SIZE
                value: "1"
              - name: TRITON_LIBCUDA_PATH
                value: /usr/lib64
              - name: VLLM_ENGINE_READY_TIMEOUT_S
                value: "1800"
              - name: VLLM_LOGGING_LEVEL
                value: INFO
              - name: VLLM_SKIP_P2P_CHECK
                value: "1"
              - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
                value: "1"
              - name: VLLM_USE_DEEP_GEMM
                value: "1"
              # NVSHMEM / DeepEP (mirroring upstream base + CoreWeave overlay)
              - name: NVSHMEM_DEBUG
                value: INFO
              - name: NVIDIA_GDRCOPY
                value: enabled
              - name: NVSHMEM_REMOTE_TRANSPORT
                value: ibgda
              - name: NVSHMEM_IB_ENABLE_IBGDA
                value: "true"
              - name: NCCL_IB_HCA
                value: "ibp"
              - name: NVSHMEM_HCA_PREFIX
                value: "ibp"
              - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
                value: eth0
              - name: GLOO_SOCKET_IFNAME
                value: eth0
              - name: NCCL_SOCKET_IFNAME
                value: eth0
              # HF token for model downloads
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: hf-secret
                    key: HF_TOKEN
              # Cache directories
              - name: CUDA_CACHE_PATH
                value: /var/cache/vllm/cuda
              - name: CCACHE_DIR
                value: /var/cache/vllm/ccache
              - name: VLLM_CACHE_ROOT
                value: /var/cache/vllm/vllm
              - name: FLASHINFER_WORKSPACE_BASE
                value: /var/cache/vllm/flashinfer
              - name: HF_HUB_CACHE
                value: /var/cache/huggingface
            ports:
              - containerPort: 8000
                name: vllm
                protocol: TCP
            startupProbe:
              httpGet:
                path: /health
                port: vllm
              initialDelaySeconds: 0
              periodSeconds: 1
              timeoutSeconds: 5
              failureThreshold: 2700
            livenessProbe:
              httpGet:
                path: /health
                port: vllm
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /v1/models
                port: vllm
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            resources:
              limits:
                memory: 512Gi
                cpu: "32"
                nvidia.com/gpu: "8"
                rdma/ib: 1
              requests:
                memory: 512Gi
                cpu: "32"
                nvidia.com/gpu: "8"
                rdma/ib: 1
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: hf-cache
                mountPath: /var/cache/huggingface
              - name: jit-cache
                mountPath: /var/cache/vllm
