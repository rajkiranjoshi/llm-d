# Single-node EP prefill test for AKS ND H100 (1 node, 8 GPUs).
# Model: Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8 (EP=8, DP=8, TP=1).
# DeepEP high-throughput all2all backend, enforce-eager.
# Purpose: rule out cross-node RDMA issues by testing NVSHMEM intra-node only.
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: wide-ep-llm-d-prefill-1n
  labels:
    llm-d.ai/inference-serving: "true"
    llm-d.ai/guide: "wide-ep-lws"
    llm-d.ai/accelerator-variant: "gpu"
    llm-d.ai/accelerator-vendor: "nvidia"
    llm-d.ai/model: Qwen3-Coder-30B-A3B-Instruct-FP8
    llm-d.ai/role: prefill
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 1
    workerTemplate:
      metadata:
        labels:
          llm-d.ai/inference-serving: "true"
          llm-d.ai/guide: "wide-ep-lws"
          llm-d.ai/accelerator-variant: "gpu"
          llm-d.ai/accelerator-vendor: "nvidia"
          llm-d.ai/model: Qwen3-Coder-30B-A3B-Instruct-FP8
          llm-d.ai/role: prefill
      spec:
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 16Gi
          - name: hf-cache
            hostPath:
              path: /mnt/local-nvme-storage/models
              type: DirectoryOrCreate
          - name: jit-cache
            hostPath:
              path: /mnt/local-nvme-storage/vllm-jit-cache
              type: DirectoryOrCreate
        containers:
          - name: vllm
            image: ghcr.io/rajkiranjoshi/llm-d-cuda:sha-c8a6e27-nic-selection
            imagePullPolicy: Always
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              capabilities:
                add:
                  - IPC_LOCK
                  - SYS_RAWIO
            command:
              - /bin/bash
              - -c
            args:
              - |-
                find /dev/shm -type f -delete

                exec vllm serve \
                  Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8 \
                  --port 8000 \
                  --trust-remote-code \
                  --disable-uvicorn-access-log \
                  --enable-expert-parallel \
                  --tensor-parallel-size 1 \
                  --data-parallel-size 8 \
                  --data-parallel-size-local 8 \
                  --async-scheduling \
                  --enable-dbo \
                  --dbo-prefill-token-threshold 32 \
                  --all2all-backend deepep_high_throughput \
                  --enforce-eager \
                  --gpu-memory-utilization 0.75
            env:
              - name: LIBRARY_PATH
                value: /usr/lib/x86_64-linux-gnu
              - name: VLLM_LOGGING_LEVEL
                value: INFO
              - name: VLLM_SKIP_P2P_CHECK
                value: "1"
              - name: VLLM_USE_DEEP_GEMM
                value: "1"
              # NVSHMEM / DeepEP
              - name: NVSHMEM_DEBUG
                value: INFO
              - name: NVSHMEM_IB_DISABLE_DMABUF
                value: "1"
              - name: NVSHMEM_IB_GID_INDEX
                value: "0"
              - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
                value: eth0
              - name: GLOO_SOCKET_IFNAME
                value: eth0
              - name: NCCL_SOCKET_IFNAME
                value: eth0
              # HF token for model downloads
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: hf-secret
                    key: HF_TOKEN
              # Cache directories
              - name: CUDA_CACHE_PATH
                value: /var/cache/vllm/cuda
              - name: CCACHE_DIR
                value: /var/cache/vllm/ccache
              - name: VLLM_CACHE_ROOT
                value: /var/cache/vllm/vllm
              - name: FLASHINFER_WORKSPACE_BASE
                value: /var/cache/vllm/flashinfer
              - name: HF_HUB_CACHE
                value: /var/cache/huggingface
            ports:
              - containerPort: 8000
                name: vllm
                protocol: TCP
            startupProbe:
              httpGet:
                path: /health
                port: vllm
              initialDelaySeconds: 0
              periodSeconds: 1
              timeoutSeconds: 5
              failureThreshold: 2700
            livenessProbe:
              httpGet:
                path: /health
                port: vllm
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /v1/models
                port: vllm
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            resources:
              limits:
                memory: 512Gi
                cpu: "32"
                nvidia.com/gpu: "8"
                rdma/shared_ib: 1
              requests:
                memory: 512Gi
                cpu: "32"
                nvidia.com/gpu: "8"
                rdma/shared_ib: 1
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: hf-cache
                mountPath: /var/cache/huggingface
              - name: jit-cache
                mountPath: /var/cache/vllm
